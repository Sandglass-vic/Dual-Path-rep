<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="985" viewBox="0 0 2400 985">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; letter-spacing: 0; }
      .panel-title { font-size: 38px; font-weight: 700; fill: #111827; }
      .legend { font-size: 25px; font-weight: 600; fill: #334155; }
      .engine-title { font-size: 33px; font-weight: 700; fill: #0f3b4c; }
      .component { font-size: 29px; font-weight: 700; }
      .memory { font-size: 26px; font-weight: 700; }
      .sub { font-size: 19px; fill: #475569; }
      .note { font-size: 20px; font-weight: 700; }
      .note-sub { font-size: 17px; fill: #475569; }
      .anno { font-size: 20px; font-weight: 600; }
      .anno-strong { font-size: 21px; font-weight: 700; }
      .caption { font-family: Georgia, 'Times New Roman', serif; font-size: 33px; font-weight: 700; fill: #111827; }
      .footer { font-size: 20px; fill: #475569; }

      .node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 3; }
      .engine-shadow { fill: #e3f3f8; stroke: #b8d4de; stroke-width: 3; }
      .engine { fill: #c7edf8; stroke: #7aaabd; stroke-width: 3.5; }
      .gpu { fill: #aee3a0; stroke: #5fa35a; stroke-width: 3.5; }
      .cnic { fill: #a3cdea; stroke: #5b95c0; stroke-width: 3.5; }
      .dram { fill: #ffcb3d; stroke: #c99500; stroke-width: 3.5; }
      .staging { fill: #ffd76a; stroke: #c99500; stroke-width: 3.5; }
      .hbm-pages { fill: #c6ebb4; stroke: #5fa35a; stroke-width: 3.5; }
      .snic { fill: #ffc9b1; stroke: #d58f72; stroke-width: 3.5; }
      .storage { fill: #a3cdea; stroke: #5b95c0; stroke-width: 3.5; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.5; }

      .path-a { fill: none; stroke: #c12aa5; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .path-b { fill: none; stroke: #087ea4; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .h2d { stroke-dasharray: 13 9; stroke-linecap: butt; }
      .ink-a { fill: #c12aa5; }
      .ink-b { fill: #087ea4; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="head-a" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#c12aa5"/>
    </marker>
    <marker id="head-b" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#087ea4"/>
    </marker>
  </defs>

  <rect width="2400" height="985" fill="#ffffff"/>

  <!-- ===================== (a) Prefill L3 Read Path ===================== -->
  <g id="prefill-read-path">
    <text x="35" y="58" class="panel-title">KV-Cache Data Path</text>
    <path d="M 420 46 H 492" class="path-a" marker-end="url(#head-a)"/>
    <text x="508" y="55" class="legend">Full KV Block</text>
    <path d="M 720 46 H 792" class="path-a h2d" marker-end="url(#head-a)"/>
    <text x="808" y="55" class="legend">NIC H2D (via CNIC)</text>

    <rect x="25" y="105" width="560" height="685" rx="18" class="node" filter="url(#shadow)"/>
    <rect x="610" y="105" width="560" height="685" rx="18" class="node" filter="url(#shadow)"/>

    <!-- Prefill engine -->
    <rect x="75" y="132" width="470" height="325" rx="14" class="engine-shadow"/>
    <rect x="58" y="150" width="470" height="325" rx="14" class="engine-shadow"/>
    <rect x="42" y="168" width="470" height="325" rx="14" class="engine" filter="url(#shadow)"/>
    <text x="277" y="222" text-anchor="middle" class="engine-title">Prefill Engine</text>
    <rect x="82" y="270" width="165" height="92" rx="10" class="gpu"/>
    <text x="164" y="326" text-anchor="middle" class="component">GPU / HBM</text>
    <rect x="318" y="270" width="155" height="92" rx="10" class="cnic"/>
    <text x="395" y="326" text-anchor="middle" class="component">CNIC</text>

    <!-- Decode engine -->
    <rect x="660" y="132" width="470" height="325" rx="14" class="engine-shadow"/>
    <rect x="643" y="150" width="470" height="325" rx="14" class="engine-shadow"/>
    <rect x="627" y="168" width="470" height="325" rx="14" class="engine" filter="url(#shadow)"/>
    <text x="862" y="222" text-anchor="middle" class="engine-title">Decode Engine</text>
    <rect x="667" y="270" width="155" height="92" rx="10" class="cnic"/>
    <text x="744" y="326" text-anchor="middle" class="component">CNIC</text>
    <rect x="893" y="270" width="165" height="92" rx="10" class="gpu"/>
    <text x="975" y="326" text-anchor="middle" class="component">GPU / HBM</text>

    <!-- Host memory, SNICs, storage -->
    <rect x="92" y="535" width="425" height="72" rx="10" class="dram" filter="url(#shadow)"/>
    <text x="304" y="566" text-anchor="middle" class="memory">Prefill HiCache Host Pool</text>
    <text x="304" y="593" text-anchor="middle" class="sub">pinned DRAM &#183; layer_first</text>
    <rect x="676" y="535" width="425" height="72" rx="10" class="staging" filter="url(#shadow)"/>
    <text x="888" y="566" text-anchor="middle" class="memory">Decode PD Host Staging</text>
    <text x="888" y="593" text-anchor="middle" class="sub">pinned DRAM &#183; layer_first</text>

    <rect x="195" y="660" width="215" height="80" rx="10" class="snic" filter="url(#shadow)"/>
    <text x="302" y="710" text-anchor="middle" class="component">SNIC</text>
    <rect x="780" y="660" width="215" height="80" rx="10" class="snic" filter="url(#shadow)"/>
    <text x="887" y="710" text-anchor="middle" class="component">SNIC</text>

    <rect x="25" y="815" width="1145" height="78" rx="14" class="storage" filter="url(#shadow)"/>
    <text x="598" y="864" text-anchor="middle" class="engine-title">Remote Storage</text>

    <!-- L3 read into the Prefill host pool -->
    <path d="M 302 813 V 744" class="path-a" marker-end="url(#head-a)"/>
    <path d="M 302 658 V 611" class="path-a" marker-end="url(#head-a)"/>

    <!-- NIC H2D on Prefill: host pool -> CNIC -> HBM -->
    <path d="M 420 533 V 366" class="path-a h2d" marker-end="url(#head-a)"/>
    <path d="M 316 340 H 251" class="path-a h2d" marker-end="url(#head-a)"/>
    <text x="405" y="408" text-anchor="end" class="anno-strong ink-a">NIC H2D &#183; RDMA loopback</text>
    <text x="405" y="436" text-anchor="end" class="sub">pinned DRAM &#8594; CNIC &#8594; HBM</text>

    <!-- P->D over compute CNICs -->
    <path d="M 249 294 H 314" class="path-a" marker-end="url(#head-a)"/>
    <path d="M 475 294 H 663" class="path-a" marker-end="url(#head-a)"/>
    <rect x="478" y="271" width="184" height="48" rx="24" class="pill"/>
    <text x="570" y="292" text-anchor="middle" class="note">Mooncake P&#8594;D</text>
    <text x="570" y="311" text-anchor="middle" class="note-sub">over compute CNICs</text>

    <!-- Decode: RDMA into host staging, then NIC H2D -->
    <path d="M 715 364 V 533" class="path-a" marker-end="url(#head-a)"/>
    <path d="M 790 533 V 366" class="path-a h2d" marker-end="url(#head-a)"/>
    <path d="M 824 318 H 889" class="path-a h2d" marker-end="url(#head-a)"/>
    <text x="812" y="404" class="anno ink-a">&#8595; RDMA into host staging</text>
    <text x="812" y="436" class="anno-strong ink-a">&#8593; NIC H2D &#183; RDMA loopback</text>
    <text x="812" y="463" class="sub">pinned DRAM &#8594; CNIC &#8594; HBM</text>

    <text x="598" y="955" text-anchor="middle" class="caption">(a) Prefill L3 Read Path</text>
  </g>

  <!-- ===================== (b) Decode L3 Read Path ===================== -->
  <g id="decode-read-path">
    <text x="1230" y="58" class="panel-title">KV-Cache Data Path</text>
    <path d="M 1615 46 H 1687" class="path-b" marker-end="url(#head-b)"/>
    <text x="1703" y="55" class="legend">Full KV Block</text>
    <path d="M 1915 46 H 1987" class="path-b h2d" marker-end="url(#head-b)"/>
    <text x="2003" y="55" class="legend">NIC H2D (via CNIC)</text>

    <rect x="1220" y="105" width="560" height="685" rx="18" class="node" filter="url(#shadow)"/>
    <rect x="1805" y="105" width="560" height="685" rx="18" class="node" filter="url(#shadow)"/>

    <!-- Prefill engine -->
    <rect x="1270" y="132" width="470" height="325" rx="14" class="engine-shadow"/>
    <rect x="1253" y="150" width="470" height="325" rx="14" class="engine-shadow"/>
    <rect x="1237" y="168" width="470" height="325" rx="14" class="engine" filter="url(#shadow)"/>
    <text x="1472" y="222" text-anchor="middle" class="engine-title">Prefill Engine</text>
    <rect x="1277" y="270" width="165" height="92" rx="10" class="gpu"/>
    <text x="1359" y="326" text-anchor="middle" class="component">GPU / HBM</text>
    <rect x="1513" y="270" width="155" height="92" rx="10" class="cnic"/>
    <text x="1590" y="326" text-anchor="middle" class="component">CNIC</text>

    <!-- Decode engine -->
    <rect x="1855" y="132" width="470" height="325" rx="14" class="engine-shadow"/>
    <rect x="1838" y="150" width="470" height="325" rx="14" class="engine-shadow"/>
    <rect x="1822" y="168" width="470" height="325" rx="14" class="engine" filter="url(#shadow)"/>
    <text x="2057" y="222" text-anchor="middle" class="engine-title">Decode Engine</text>
    <rect x="1862" y="270" width="155" height="92" rx="10" class="cnic"/>
    <text x="1939" y="326" text-anchor="middle" class="component">CNIC</text>
    <rect x="2088" y="270" width="165" height="92" rx="10" class="gpu"/>
    <text x="2170" y="326" text-anchor="middle" class="component">GPU / HBM</text>

    <!-- Memory, SNICs, storage -->
    <rect x="1287" y="535" width="425" height="72" rx="10" class="dram" filter="url(#shadow)"/>
    <text x="1499" y="566" text-anchor="middle" class="memory">Prefill HiCache Host Pool</text>
    <text x="1499" y="593" text-anchor="middle" class="sub">pinned DRAM &#183; layer_first</text>
    <rect x="1871" y="535" width="425" height="72" rx="10" class="staging" filter="url(#shadow)"/>
    <text x="2083" y="566" text-anchor="middle" class="memory">Decode PD Host Staging</text>
    <text x="2083" y="593" text-anchor="middle" class="sub">pinned DRAM &#183; layer_first</text>

    <rect x="1390" y="660" width="215" height="80" rx="10" class="snic" filter="url(#shadow)"/>
    <text x="1497" y="710" text-anchor="middle" class="component">SNIC</text>
    <rect x="1975" y="660" width="215" height="80" rx="10" class="snic" filter="url(#shadow)"/>
    <text x="2082" y="710" text-anchor="middle" class="component">SNIC</text>

    <rect x="1220" y="815" width="1145" height="78" rx="14" class="storage" filter="url(#shadow)"/>
    <text x="1793" y="864" text-anchor="middle" class="engine-title">Remote Storage</text>

    <!-- L3 read into Decode host staging -->
    <path d="M 2082 813 V 744" class="path-b" marker-end="url(#head-b)"/>
    <path d="M 2082 658 V 611" class="path-b" marker-end="url(#head-b)"/>

    <!-- L3 prefix: staging -> Decode CNIC -> reverse RDMA into Prefill HBM -->
    <path d="M 1890 533 V 366" class="path-b" marker-end="url(#head-b)"/>
    <path d="M 1940 268 V 240 H 1590 V 266" class="path-b" marker-end="url(#head-b)"/>
    <rect x="1628" y="217" width="276" height="46" rx="23" class="pill"/>
    <text x="1766" y="237" text-anchor="middle" class="note">Mooncake D&#8594;P</text>
    <text x="1766" y="256" text-anchor="middle" class="note-sub">reverse RDMA into Prefill HBM</text>
    <path d="M 1511 300 H 1446" class="path-b" marker-end="url(#head-b)"/>

    <!-- After Prefill compute: P->D into Decode host staging -->
    <path d="M 1444 342 H 1509" class="path-b" marker-end="url(#head-b)"/>
    <path d="M 1670 342 H 1858" class="path-b" marker-end="url(#head-b)"/>
    <rect x="1676" y="320" width="176" height="46" rx="23" class="pill"/>
    <text x="1764" y="340" text-anchor="middle" class="note">Mooncake P&#8594;D</text>
    <text x="1764" y="359" text-anchor="middle" class="note-sub">after Prefill compute</text>
    <path d="M 1940 364 V 533" class="path-b" marker-end="url(#head-b)"/>

    <!-- NIC H2D on Decode: staging -> CNIC -> HBM -->
    <path d="M 1990 533 V 366" class="path-b h2d" marker-end="url(#head-b)"/>
    <path d="M 2019 318 H 2084" class="path-b h2d" marker-end="url(#head-b)"/>
    <text x="2010" y="398" class="anno ink-b">&#8593; L3 prefix for D&#8594;P</text>
    <text x="2010" y="426" class="anno ink-b">&#8595; P&#8594;D into host staging</text>
    <text x="2010" y="456" class="anno-strong ink-b">&#8593; NIC H2D &#183; RDMA loopback</text>
    <text x="2010" y="482" class="sub">pinned DRAM &#8594; CNIC &#8594; HBM</text>

    <text x="1793" y="955" text-anchor="middle" class="caption">(b) Decode L3 Read Path</text>
  </g>

</svg>
